<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Can't reach this page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="icon">☁️</div>
        <h1>Hmmm... can't reach this page</h1>
        <div class="subtitle">
            <strong id="failed-url">Unknown</strong>
            <span id="error-message">took too long to respond</span>
        </div>

        <div class="suggestions">
            <p><strong>Try:</strong></p>
            <ul>
                <li>Checking the connection</li>
                <li>Checking the proxy and the firewall</li>
                <li>Making sure the server is online</li>
            </ul>
        </div>

        <div class="buttons">
            <button class="btn-primary"
                onclick="window.chrome.webview.postMessage('troubleshoot')">Troubleshoot</button>
            <button class="btn-secondary" onclick="location.reload()">Refresh</button>
        </div>

        <div class="error-code">ERR_CONNECTION_TIMED_OUT</div>
    </div>

    <script>
        // Receive the failed URL from the app
        window.chrome.webview.addEventListener('message', event => {
            const data = event.data;
            if (data.url) {
                document.getElementById('failed-url').textContent = data.url;
            }
            if (data.message) {
                document.getElementById('error-message').textContent = data.message;
            }

            if (data.dark === true) {
                document.body.classList.add("dark");
                document.body.classList.remove("light");
            } else {
                document.body.classList.add("light");
                document.body.classList.remove("dark");
            }
        });
    </script>
</body>

</html>
